<!DOCTYPE html>
<!-- This page is the sign up page where user enters email, password, username, date of birth. There is a back button and also a log in button if they already have an account -->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokémon | Sign Up</title>
    <link rel="stylesheet" href="/styling/styles.css"/>
</head>
<body>
    <img class="logo" src="<%=logoPath %>" alt="logo">

   <div class = "create-account">
    <div class="sign-up-container">
        <h2>Create your account</h2>
        <form class="signup-button>
            <label for="email">Email Address:</label>
            <input type="text" name="email" placeholder="Email Address" required>

            <label for="username">Username:</label>
            <input type="text" name="username" placeholder="Username" required>

            <label for="date-birth">Date of Birth:</label>
            <input type="date" name="date-birth" required>

            <label for="password">Password:</label>
            <input type="password" name="password" placeholder="Password" required>

            <label for="confirm-password">Confirm Password:</label>
            <input type="password" name="confirm-password" placeholder="Confirm Password" required>

            <button type="submit">Create Account</button>
        </form>
    </div>
  
    <p class = "back-to-index"> <a href = "/index.html" class = "button back-index-button">Go Back</a> </p>
 </div>
</body>
</html>
