<!DOCTYPE html>
<!-- This page is the log in page which takes the users email address and password. There os also a back button and a button for "no account, sign up" -->
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/styling/styles.css" />
    <title>Pokemon | Login</title>
</head>

<body>
    <p class="logo"> <img class="pokemon-logo" src="/images/Pokémon_Logo.png"></p>
    <h1 class="welcome"> </h1>
    
    </div>

    <div class="login-container">
        <div class="back"> <a href="/index.html" class="button back-button">Go Back</a>
        <h2>Login</h2>

        <form class="login-form">

            <label for="username">Username:</label>
            <input type="text" name="username" placeholder="Username" required>

            <label for="password">Password:</label>
            <input type="password" name="password" placeholder="Password" required>

            <button type="submit">Login</button>
        </form>
    </div>


</body>

</html>
