<!DOCTYPE html>
<!-- This page is the log in page which takes the users email address and password. There os also a back button and a button for "no account, sign up" -->
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css"
        integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO" crossorigin="anonymous">
    <!-- <link rel="stylesheet" href="/styling/styles.css" /> -->
    <title>Pokemon | Login</title>
</head>

<body>
    <p class="logo"> <img class="pokemon-logo" src="/images/Pokémon_Logo.png"></p>
    <h1 class="welcome"> </h1>

    </div>
    <div class="container-fluid"></div>
    <!-- <div class="login-container"> -->
    <div class="container-fluid"> 
        <a href="/index.html" class="btn btn-info "> 
            <span class="glyphicon glyphicon-arrow-left"></span>Go Back
        </a>
        <h2>Login</h2>


        <form class="login-form">
            <div class="form-group">
                <label for="username">Username:</label>
                <input type="text" class="form-control" name="username" placeholder="Enter Username" required id="username">

            </div>
            <div class="form-group">
                <label for="password">Password:</label>
                <input type="password"  class="form-control" name="password" placeholder="Enter Password" required>

            </div>

            <button type="submit" class="btn btn-info" <a href="./member-views/member-home.html"></a>Login</button>
        </form>
    </div>


</body>

</html>
